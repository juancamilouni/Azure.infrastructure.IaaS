#   contact_emails_80: "$BUDGET_EMAILS_80"
#   threshold_90: 90
#   operator_90: "GreaterThan"
#   contact_emails_90: "$BUDGET_EMAILS_90"

budget:
  name_grup: "$BUDGET_NAME_GRUP"
  amount_grup: $BUDGET_AMOUNT_GRUP
  time_grain: "$BUDGET_TIME_GRAIN"
  start_date: "$BUDGET_START_DATE"
  end_date: "$BUDGET_END_DATE"
  threshold_80: 80
  operator_80: "GreaterThan"
  contact_emails_80: "$BUDGET_EMAILS_80"
  threshold_90: 90
  operator_90: "GreaterThan"
  contact_emails_90: "$BUDGET_EMAILS_90"

# Etiquetas (tags)
tags:
  Environment: "$ENVIRONMENT"
  Owner: "$PR_OWNER"
  Tipo_Recurso: "$MODULE_NAME"
  Proyecto: "$PROJECT_NAME"
