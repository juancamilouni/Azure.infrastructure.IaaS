name: Despliegue con Terragrunt (GitHub App)

on:
  repository_dispatch:
    types: [deploy-module]

permissions:
  contents: read
  id-token: write
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.client_payload.environment }}

    env:
      ARM_CLIENT_ID: ${{ secrets.CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.DATA_SUBSCRIPTION_ID }}
      AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
      AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}
      ARM_USE_OIDC: true

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.DATA_SUBSCRIPTION_ID }}

      - name: Verificar autenticación Azure
        run: az account show

      - name: Instalar Terragrunt
        run: |
          curl -sL https://github.com/gruntwork-io/terragrunt/releases/latest/download/terragrunt_linux_amd64 -o terragrunt
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

#  solo se utiliza despues de la creacion de grupo de recursos 
      # - name: 🔍 Validar secretos de entorno 
      #   run: |
      #     if [ -z "${{ secrets.AZURE_STORAGE_ACCOUNT }}" ] || [ -z "${{ secrets.AZURE_STORAGE_CONTAINER }}" ]; then
      #       echo "❌ Secretos AZURE_STORAGE_ACCOUNT o AZURE_STORAGE_CONTAINER faltan."
      #       exit 1
      #     fi

      - name: Generar archivo common_vars.yaml
        run: |
          export DATA_SUBSCRIPTION_ID="${{ secrets.DATA_SUBSCRIPTION_ID }}"
          export TENANT_ID="${{ secrets.TENANT_ID }}"
          export AZURE_STORAGE_ACCOUNT="${{ secrets.AZURE_STORAGE_ACCOUNT }}"
          export AZURE_STORAGE_CONTAINER="${{ secrets.AZURE_STORAGE_CONTAINER }}"
          export CLIENT_ID="${{ secrets.CLIENT_ID }}"
          export SQL_ADMIN_PASSWORD="${{ secrets.SQL_ADMIN_PASSWORD}}"
          export AAD_OBJECT_ID="${{ vars.AAD_OBJECT_ID }}"
          export AAD_LOGIN_NAME="${{ vars.AAD_LOGIN_NAME }}"
          export AZURE_GLOBAL_REGION="${{ vars.AZURE_GLOBAL_REGION }}"
          export AZURE_REGION="${{ vars.AZURE_REGION }}"
          export COUNTRY="${{ vars.COUNTRY }}"
          export ENVIRONMENT="${{ vars.ENVIRONMENT }}"
          export NETWORK_ADDRESS_SPACE="${{ vars.NETWORK_ADDRESS_SPACE }}"
          export NETWORK_SUBNET_NAME_1="${{ vars.NETWORK_SUBNET_NAME_1 }}"
          export NETWORK_SUBNET_NAME_2="${{ vars.NETWORK_SUBNET_NAME_2 }}"
          export NETWORK_SUBNET_NAME_3="${{ vars.NETWORK_SUBNET_NAME_3 }}"
          export NETWORK_SUBNET_NAME_4="${{ vars.NETWORK_SUBNET_NAME_4 }}"
          export NETWORK_SUBNET_ADDRESS_PREFIX_1="${{ vars.NETWORK_SUBNET_ADDRESS_PREFIX_1}}"
          export NETWORK_SUBNET_ADDRESS_PREFIX_2="${{ vars.NETWORK_SUBNET_ADDRESS_PREFIX_2}}"
          export NETWORK_SUBNET_ADDRESS_PREFIX_3="${{ vars.NETWORK_SUBNET_ADDRESS_PREFIX_3}}"
          export NETWORK_SUBNET_ADDRESS_PREFIX_4="${{ vars.NETWORK_SUBNET_ADDRESS_PREFIX_4}}"
          export PROJECT_NAME="${{ vars.PROJECT_NAME }}"
          export PR_OWNER="${{ vars.PR_OWNER }}"
          export RESOURCE_GROUP="${{ vars.RESOURCE_GROUP }}"
          export SQL_ADMIN_USERNAME="${{ vars.SQL_ADMIN_USERNAME }}"
          export SQL_DATABASE_COLLATION="${{ vars.SQL_DATABASE_COLLATION }}"
          export SQL_DATABASE_MAX_SIZE_GB="${{ vars.SQL_DATABASE_MAX_SIZE_GB }}"
          export SQL_DATABASE_NAME="${{ vars.SQL_DATABASE_NAME }}"
          export SQL_DATABASE_SKU="${{ vars.SQL_DATABASE_SKU }}"
          export SQL_LICENSE_TYPE="${{ vars.SQL_LICENSE_TYPE }}"
          export SQL_SERVER_NAME="$(echo '${{ vars.SQL_SERVER_NAME }}' | tr -d '\n' | tr -d '\r' | xargs)"
          export SQL_SERVER_VERSION="${{ vars.SQL_SERVER_VERSION }}"
          export SQL_STORAGE_ACCOUNT_TYPE="${{ vars.SQL_STORAGE_ACCOUNT_TYPE }}"
          export SQL_MINIMUM_TLS_VERSION="${{ vars.SQL_MINIMUM_TLS_VERSION }}"
          export SQL_FIREWALL_RULE_GENERAL_RCSA="${{ vars.SQL_FIREWALL_RULE_GENERAL_RCSA }}"
          export SQL_FIREWALL_RULE_GENERAL_RCSA_EXTRA="${{ vars.SQL_FIREWALL_RULE_GENERAL_RCSA_EXTRA }}"
          export SQL_FIREWALL_RULE_PARTICULAR_RCSA_1="${{ vars.SQL_FIREWALL_RULE_PARTICULAR_RCSA_1 }}"
          export STORAGE_ACCOUNT_AUDITORIA_NAME="${{ vars.STORAGE_ACCOUNT_AUDITORIA_NAME }}"
          export STORAGE_CONTAINER_AUDITORIA_NAME="${{ vars.STORAGE_CONTAINER_AUDITORIA_NAME }}"
          export GATEWAY_SUBNET_PREFIX="${{ vars.GATEWAY_SUBNET_PREFIX }}"
          export VPN_CLIENT_ADDRESS_SPACE="${{ vars.VPN_CLIENT_ADDRESS_SPACE }}"
          export GATEWAY_SKU="${{ vars.GATEWAY_SKU }}"
          export PUBLIC_IP_NAME="${{ vars.PUBLIC_IP_NAME }}"
          export GATEWAY_NAME="${{ vars.GATEWAY_NAME }}"
          export IP_CONFIGURATION_NAME="${{ vars.IP_CONFIGURATION_NAME }}"
          export NAME_SUBNET_GATEWAY="${{ vars.NAME_SUBNET_GATEWAY }}"
          export PRIVATE_ENDPOINT_NAME="${{ vars.PRIVATE_ENDPOINT_NAME }}"
          export BUDGET_SCOPE="${{ vars.BUDGET_SCOPE }}"
          export BUDGET_SCOPE_GRUP="${{ vars.BUDGET_SCOPE_GRUP }}"
          export BUDGET_NAME="${{ vars.BUDGET_NAME }}"
          export BUDGET_NAME_GRUP="${{ vars.BUDGET_NAME_GRUP }}"
          export BUDGET_AMOUNT="${{ vars.BUDGET_AMOUNT }}"
          export BUDGET_AMOUNT_GRUP="${{ vars.BUDGET_AMOUNT_GRUP }}"
          export BUDGET_TIME_GRAIN="${{ vars.BUDGET_TIME_GRAIN }}"
          export BUDGET_START_DATE="${{ vars.BUDGET_START_DATE }}"
          export BUDGET_END_DATE="${{ vars.BUDGET_END_DATE }}"
          export BUDGET_EMAILS_80="${{ vars.BUDGET_EMAILS_80 }}"
          export BUDGET_EMAILS_90="${{ vars.BUDGET_EMAILS_90 }}"
          export PUBLIC_NETWORK_ACCESS_ENABLED="${{ vars.PUBLIC_NETWORK_ACCESS_ENABLED }}"
          envsubst < common_vars.template.yaml > common_vars.yaml

      - name: Validar existencia del módulo
        run: |
          if [ ! -d "${{ github.event.client_payload.module }}" ]; then
            echo "❌ El módulo no existe: ${{ github.event.client_payload.module }}"
            exit 1
          fi

      - name: Obtener token dinámico de GitHub App
        id: app_token
        env:
          APP_ID: "1854620"
          INSTALLATION_ID: "83107821"
          PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
        run: |
          pip install PyJWT cryptography requests
          echo "import jwt, time, os" > generate_jwt.py
          echo "private_key = os.environ['PRIVATE_KEY'].encode('utf-8')" >> generate_jwt.py
          echo "app_id = os.environ['APP_ID']" >> generate_jwt.py
          echo "payload = {'iat': int(time.time()) - 60, 'exp': int(time.time()) + (10 * 60), 'iss': app_id}" >> generate_jwt.py
          echo "token = jwt.encode(payload, private_key, algorithm='RS256')" >> generate_jwt.py
          echo "print(token)" >> generate_jwt.py
          JWT=$(python3 generate_jwt.py)

          TOKEN_RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $JWT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/app/installations/${INSTALLATION_ID}/access_tokens)

          INSTALL_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r .token)

          if [ "$INSTALL_TOKEN" = "null" ] || [ -z "$INSTALL_TOKEN" ]; then
            echo "❌ Error al obtener token de instalación."
            echo "$TOKEN_RESPONSE"
            exit 1
          fi

          echo "::add-mask::$INSTALL_TOKEN"
          echo "token=$INSTALL_TOKEN" >> $GITHUB_OUTPUT

      - name: Sobrescribir source con token, módulo y versión
        working-directory: ${{ github.event.client_payload.module }}
        run: |
          echo "🔧 Reescribiendo 'source' en terragrunt.hcl"
          MODULO="${{ github.event.client_payload.module }}"
          VERSION="${{ github.event.client_payload.version }}"
          INSTALL_TOKEN="${{ steps.app_token.outputs.token }}"
          echo "module: $MODULO"
          echo "version: $VERSION"

          if [ -z "$INSTALL_TOKEN" ]; then
            echo "❌ El token de instalación está vacío. Abortando."
            exit 1
          fi

          sed -i -E "s|source *=.*|source = \"git::https://x-access-token:${INSTALL_TOKEN}@github.com/ocrcsa/it_landing-zone-IaC.git//${MODULO}?ref=${VERSION}\"|" terragrunt.hcl
          
      - name: Verificar y limpiar bloque generate si provider ya existe
        working-directory: ${{ github.event.client_payload.module }}
        run: |
          if grep -q 'provider\s\+\"azurerm\"' *.tf; then
            echo "⚠️ Provider ya definido en archivo .tf. Eliminando bloque 'generate' de provider."
            sed -i '/generate\s\+"provider"/,/EOF/ d' terragrunt.hcl || true
          else
            echo "✅ No hay provider definido. Se mantiene el bloque generate."
          fi

      - name: Validar y aplicar módulo con Terragrunt
        working-directory: ${{ github.event.client_payload.module }}
        run: |
          echo "📦 Módulo: ${{ github.event.client_payload.module }}"
          echo "🔖 Versión: ${{ github.event.client_payload.version }}"
          echo "🌍 Ambiente: ${{ github.event.client_payload.environment }}"

          echo "🚀 terragrunt init"
          terragrunt init

          echo "🔍 terragrunt validate"
          terragrunt validate

          echo "📊 Ejecutando terragrunt plan..."
          terragrunt plan -no-color > plan_output.log 2>&1 || echo "⚠️ Plan fallido, analizando log..."

          echo "📄 Contenido de plan_output.log:"
          cat plan_output.log

          if grep -q "Error acquiring the state lock" plan_output.log; then
            LOCK_ID=$(grep -oE "[a-f0-9]{8}-([a-f0-9]{4}-){3}[a-f0-9]{12}" plan_output.log | head -n 1)
            if [ -n "$LOCK_ID" ]; then
              echo "🔓 Ejecutando force-unlock con ID: $LOCK_ID"
              terragrunt force-unlock -force "$LOCK_ID"
              echo "♻️ Reintentando terragrunt plan..."
              terragrunt plan -no-color > plan_output.log 2>&1 || echo "⚠️ Reintento fallido, analizando..."
              cat plan_output.log
            else
              echo "❌ No se pudo extraer el LOCK_ID. Abortando."
              exit 1
            fi
          fi

          if grep -E "^│ Error: " plan_output.log; then
            echo "❌ Error real detectado en terragrunt plan. Abortando apply."
            exit 1
          fi

          echo "✅ Validación exitosa. Ejecutando terragrunt apply..."
          terragrunt apply -auto-approve || exit 1

          echo "🎉 Despliegue exitoso para ${{ github.event.client_payload.module }} en ${{ github.event.client_payload.environment }} ✅"
